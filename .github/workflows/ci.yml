name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked sensitive files
        run: bash scripts/check-sensitive-files.sh --tracked

  backend:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build commands
        run: |
          go build ./cmd/server
          go build ./cmd/worker
          go build ./cmd/users
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit

  containers:
    name: Containers
    runs-on: ubuntu-latest
    needs: [repository, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build api worker web
      - name: Validate nginx
        run: docker compose run --rm --no-deps web nginx -t
